# Two jobs, deliberately independent.
#
# `tests` is ours and fully deterministic: the app declares no dependencies, so
# there is no install step and nothing to resolve from a registry. If it goes
# red, we broke something.
#
# `validate` runs Athom's own validator, and it floats by design. The store
# rules live in the CLI, so pinning it would give a green light against last
# year's requirements while the store rejects the app. A red `validate` with a
# green `tests` means the requirements moved, not that we did — which is the
# whole reason these are separate jobs rather than steps in one. Neither
# `needs:` the other; making validate wait would hide the test result on a day
# when Athom changed something.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Because the validator floats, the app can stop meeting the store's
  # requirements without anyone touching this repository. A weekly run says so
  # while there is still time to react, instead of on the day you want to
  # publish. Only `validate` runs on this trigger — re-running deterministic
  # checks against unchanged code proves nothing.
  schedule:
    - cron: '0 6 * * 1'

# Both jobs only read the checkout. Anything else the default token could do is
# authority this workflow has no use for.
permissions:
  contents: read

# A quick follow-up push should cancel the run it supersedes.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Offline checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      # Read from .nvmrc, so the version lives in one place and a developer
      # running "nvm use" gets the same Node the checks run on. It says 24
      # because the Homey CLI requires >=24 from 4.4.4 onward; on an older
      # Node npm quietly installs an older CLI instead of failing, which is
      # how a local validate and CI's can disagree without either saying so.
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      # No `npm ci`: package.json declares no dependencies, and every check
      # below is plain Node against files in this repository.
      - name: Driver and device behaviour
        run: node tools/rxtest.js .

      - name: Pairing search
        run: node tools/pairtest.js .

      - name: Captured codes against the frame structure
        run: node tools/check_codes.js

      - name: Why the light codes stay out of the receive matcher
        run: node tools/check_light_codes.js

      - name: Pairing views and locale keys
        run: node tools/check_views.js

      # tools/timing_stats.js and tools/decode_sub.py are deliberately absent.
      # The first asserts nothing at all — it prints measured timings and always
      # exits 0. The second only checks that each capture yields a repeated
      # 41-bit frame, never that it yields the RIGHT one, and it would pull a
      # Python dependency into a Node workflow. Both are instruments for a human
      # reading a new capture, not checks worth re-running on every push.

  validate:
    name: Homey app validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Pinned to the v1 commit. That does NOT pin the toolchain — the action is
      # a Dockerfile on `node:lts-alpine` whose entrypoint ends in `npx homey
      # app validate`, so both Node and the CLI are whatever is current on the
      # day. (A run on 2026-09-05 resolved homey@4.4.4.) What the pin does buy
      # is integrity of the action's own code: `master` could be edited to run
      # something else entirely.
      #
      # v1's entrypoint also runs `npm ci --ignore-scripts` first, which is why
      # this repository carries a package-lock.json despite declaring no
      # dependencies. Without one that command fails with EUSAGE, and the job
      # stays green only because v1's script has no `set -e`. Depending on a
      # missing flag in someone else's 2024 shell script is not a plan.
      - uses: athombv/github-action-homey-app-validate@002b7273c2b86032cb20d9bf25a67c8daca13f2c
        with:
          level: publish

